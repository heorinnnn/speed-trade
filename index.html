<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스피드 트레이드 20분 타이머</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/NeoDunggeunmoPro-Regular.woff2');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #000000; /* 완전한 검정 배경 */
      font-family: 'NeoDunggeunmoPro-Regular', sans-serif, monospace;
      overflow: hidden;
    }

    /* 전체 배치를 아래로 5커서(약 50px) 정도 내림 */
    .top-image {
      max-width: 420px;
      width: 50vw;
      height: auto;
      margin-bottom: 5px;
      object-fit: contain;
      transform: translateY(-50px); /* 기존 -100px에서 -50px로 내려서 전체적으로 아래로 이동 */
    }

    .timer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transform: translateY(-10px); /* 타이머 전체 위치도 함께 아래로 조정 */
    }

    .timer-display {
      font-size: 6.5rem;
      font-weight: bold;
      color: #FFFFFF;
      letter-spacing: 4px;
      margin-bottom: 24px;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.9), 0 0 40px rgba(255, 255, 255, 0.5);
    }

    .button-group {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 10px 24px;
      font-size: 1.3rem;
      font-family: inherit;
      color: #FFFFFF;
      background-color: rgba(0, 0, 0, 0.4);
      border: 2px solid #FFFFFF;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .btn:hover {
      background-color: #FFFFFF;
      color: #000000;
      text-shadow: none;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: #777777;
      color: #777777;
      box-shadow: none;
      text-shadow: none;
      background-color: transparent;
    }
  </style>
</head>
<body>

  <!-- 타이머 위쪽에 올라올 이미지 -->
  <img src="text.png" alt="Text Image" class="top-image">

  <div class="timer-container">
    <div id="timer" class="timer-display">20:00</div>
    <div class="button-group">
      <button id="startBtn" class="btn">START</button>
      <button id="pauseBtn" class="btn" disabled>PAUSE</button>
      <button id="resetBtn" class="btn">RESET</button>
    </div>
  </div>

  <script>
    const INITIAL_SECONDS = 20 * 60;
    let timeLeft = INITIAL_SECONDS;
    let timerInterval = null;

    const timerDisplay = document.getElementById('timer');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = seconds % 60;
      return String(minutes).padStart(2, '0') + ':' + String(remainingSeconds).padStart(2, '0');
    }

    function startTimer() {
      if (timerInterval !== null) return;

      startBtn.disabled = true;
      pauseBtn.disabled = false;

      timerInterval = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = formatTime(timeLeft);

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          timerDisplay.textContent = "00:00";
          startBtn.disabled = false;
          pauseBtn.disabled = true;
          alert("20분이 종료되었습니다!");
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      startBtn.disabled = false;
      pauseBtn.disabled = true;
    }

    function resetTimer() {
      pauseTimer();
      timeLeft = INITIAL_SECONDS;
      timerDisplay.textContent = formatTime(timeLeft);
      startBtn.disabled = false;
      pauseBtn.disabled = true;
    }

    startBtn.addEventListener('click', startTimer);
    pauseBtn.addEventListener('click', pauseTimer);
    resetBtn.addEventListener('click', resetTimer);
  </script>
</body>
</html>
